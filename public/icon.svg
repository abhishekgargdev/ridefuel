<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gaugeTrack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#334155" stroke-width="8" />

  <!-- Outer Dial Rim (Classic Chrome / Brass Accent) -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#amberGlow)" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="6 8" />

  <!-- Tachometer/Fuel Arc -->
  <path d="M 120 330 A 160 160 0 1 1 392 330" fill="none" stroke="url(#gaugeTrack)" stroke-width="26" stroke-linecap="round" />
  <!-- Active Fuel Level Arc (Full to 65%) -->
  <path d="M 120 330 A 160 160 0 1 1 330 160" fill="none" stroke="url(#amberGlow)" stroke-width="26" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Motorcycle Fuel Drop Icon in Center -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Gas Can / Fuel Pump silhouette -->
    <path d="M -35 -40 L 15 -40 C 25 -40 32 -32 32 -20 L 32 35 C 32 45 25 50 15 50 L -35 50 C -45 50 -50 45 -50 35 L -50 -20 C -50 -32 -42 -40 -35 -40 Z" fill="#1e293b" stroke="#64748b" stroke-width="4" />
    <!-- Fuel drop in pump -->
    <path d="M -10 -5 C -10 -5 -25 15 -25 25 C -25 34 -18 40 -10 40 C -2 40 5 34 5 25 C 5 15 -10 -5 -10 -5 Z" fill="url(#amberGlow)" />
    <!-- Pump hose & nozzle -->
    <path d="M 32 -10 L 44 -10 C 50 -10 54 -6 54 0 L 54 25 C 54 32 48 35 44 32 L 40 28" fill="none" stroke="url(#amberGlow)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Speed Needle Pivot -->
  <circle cx="256" cy="340" r="18" fill="#d97706" stroke="#fbbf24" stroke-width="4" />
  <circle cx="256" cy="340" r="8" fill="#0f172a" />

  <!-- Needle Pointing toward 45 degrees -->
  <line x1="256" y1="340" x2="310" y2="210" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

  <!-- Text Badge -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#f8fafc" text-anchor="middle">RIDEFUEL</text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="3" fill="#fbbf24" text-anchor="middle">ROYAL ENFIELD 350</text>
</svg>
